spring:
  application:
    name: taskflow-ai

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/taskflow_ai}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:TaskFlowAI-Super-Secret-Key-Change-In-Production-Min-256-Bits-Long!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  oauth:
    google-enabled: ${GOOGLE_OAUTH_ENABLED:false}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  ai:
    provider: ${AI_PROVIDER:gemini}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-2.5-flash}
    base-url: ${AI_BASE_URL:}

logging:
  level:
    root: INFO
    com.taskflowai: DEBUG
    org.springframework.security: INFO
