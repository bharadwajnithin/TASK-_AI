spring:
  application:
    name: taskflow-ai

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/taskflow_ai}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  forward-headers-strategy: framework
  servlet:
    context-path: /

app:
  jwt:
    secret: ${JWT_SECRET:TaskFlowAI-Super-Secret-Key-Change-In-Production-Min-256-Bits-Long!!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://taskai-dusky.vercel.app,http://localhost:5173,http://localhost:3000}
  frontend-url: ${FRONTEND_URL:https://taskai-dusky.vercel.app}
  oauth:
    google-enabled: ${GOOGLE_OAUTH_ENABLED:true}
    google-client-id: ${GOOGLE_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CLIENT_SECRET:}
  ai:
    provider: ${AI_PROVIDER:gemini}
    api-key: ${AI_API_KEY:${GEMINI_API_KEY:}}
    model: ${AI_MODEL:${GEMINI_MODEL:gemini-2.5-flash}}
    base-url: ${AI_BASE_URL:}

logging:
  level:
    root: INFO
    com.taskflowai: DEBUG
    org.springframework.security: INFO
